# 데모 Supabase 프로젝트가 멈추지 않게 사흘마다 가벼운 요청을 보낸다.
#
# Supabase 무료 플랜은 일주일가량 쓰이지 않은 프로젝트를 일시정지한다. 데모는 포트폴리오 방문이
# 없으면 아무도 쓰지 않아서 멈추고, 그러면 데모 사이트 로그인이 통째로 안 된다(2026-10 실제로 겪음).
#
# 요청은 로그인 화면에서도 부르는 list_teams RPC 하나다(비로그인 실행 허용, 팀 이름만 돌려준다).
# 주소와 키는 저장소에 커밋된 .env.production(데모 전용 공개 키)에서 읽어서 따로 비밀값이 필요 없다.
#
# 참고: 공개 저장소의 예약 워크플로는 저장소에 60일 동안 활동이 없으면 GitHub가 끈다. 릴리스마다
# 원본을 동기화해 커밋하므로 보통은 문제없지만, 꺼졌다는 메일이 오면 Actions 탭에서 다시 켠다.
name: 데모 DB 깨우기

on:
  schedule:
    - cron: '17 3 */3 * *' # 사흘마다 UTC 03:17 (KST 12:17)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false

      - name: 데모 DB에 요청 보내기
        run: |
          set -euo pipefail
          url="$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '\r"')"
          key="$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env.production | cut -d= -f2- | tr -d '\r"')"
          status="$(curl -s -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "$url/rest/v1/rpc/list_teams" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}')"
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "데모 DB가 응답하지 않습니다. Supabase 대시보드에서 프로젝트가 일시정지됐는지 확인하세요." >&2
            cat response.json >&2 || true
            exit 1
          fi
